<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darbo Valandų Žurnalas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-10">
    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm p-5 mb-4 text-center border border-gray-100">
            <h1 id="ui-title" class="text-2xl font-bold text-gray-900 mb-1">Darbo Valandų Žurnalas</h1>
            <p id="ui-subtitle" class="text-sm text-gray-500 mb-3">Valdykite savo darbo laiką lengvai</p>
            
            <!-- Kas pildo ataskaitą laukelis -->
            <div class="mb-3 text-left">
                <label id="ui-pildytojas-label" for="pildytojasInput" class="block text-xs font-semibold text-gray-600 mb-1">Ataskaitą pildo:</label>
                <input type="text" id="pildytojasInput" placeholder="Įrašykite vardą / pavardę" class="w-full text-sm px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
            </div>

            <div class="flex justify-center gap-2">
                <select id="langSelect" class="text-xs bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1.5 text-gray-600 focus:outline-none">
                    <option value="lt">🇱🇹 Lietuvių</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="ru">🇷🇺 Русский</option>
                </select>
            </div>
        </div>

        <!-- Dienų sąrašas -->
        <div id="daysContainer" class="space-y-3 mb-4">
            <!-- Čia JavaScript sugeneruos dienas -->
        </div>

        <!-- Bendra suma -->
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-4 border border-gray-100">
            <div class="flex justify-between items-center mb-1">
                <span id="ui-total-hours-label" class="text-xs font-bold text-gray-500 tracking-wider">VISO VALANDŲ PER SAVAITĘ:</span>
                <span id="totalHours" class="text-xl font-extrabold text-blue-600">0.0 val.</span>
            </div>
            <div class="flex justify-between items-center">
                <span id="ui-people-count-label" class="text-[11px] text-gray-400">ŽMOGUS / BENDRA SUMA:</span>
                <span id="totalPeopleSum" class="text-xs font-semibold text-gray-600">0 žm. bendrai</span>
            </div>
        </div>

        <!-- AI Mygtukas -->
        <button id="aiBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2 mb-3 text-sm">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="ui-ai-btn">Versti užrašus (AI)</span>
        </button>

        <!-- Eksporto mygtukai -->
        <div class="grid grid-cols-2 gap-3">
            <button id="exportExcel" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-file-excel fa-solid"></i> Excel (.xlsx)
            </button>
            <button id="exportWord" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-file-word fa-solid"></i> Word (.docx)
            </button>
        </div>
    </div>

    <!-- AI Modalas -->
    <div id="aiModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl">
            <h3 id="ui-modal-title" class="font-bold text-lg mb-2 text-gray-900">AI Užrašų Vertimas</h3>
            <p id="ui-modal-desc" class="text-xs text-gray-500 mb-3">Įklijuokite savo netvarkingus užrašus, ir AI juos sutvarkys bei priskirs dienoms.</p>
            <textarea id="aiInputText" rows="4" class="w-full text-sm p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3 bg-gray-50" placeholder="Pvz.: Pirmadieni dirbau 8 val 2 zmones..."></textarea>
            <div class="flex gap-2">
                <button id="aiCloseModal" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-xl text-sm transition">Atšaukti</button>
                <button id="aiProcessBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-sm transition">Vykdyti</button>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            lt: {
                title: "Darbo Valandų Žurnalas",
                subtitle: "Valdykite savo darbo laiką lengvai",
                pildytojasLabel: "Ataskaitą pildo:",
                pildytojasPlaceholder: "Įrašykite vardą / pavardę",
                totalHours: "VISO VALANDŲ PER SAVAITĘ:",
                peopleSum: "žm. bendrai",
                aiBtn: "Versti užrašus (AI)",
                modalTitle: "AI Užrašų Vertimas",
                modalDesc: "Įklijuokite savo netvarkingus užrašus, ir AI juos sutvarkys.",
                cancel: "Atšaukti",
                process: "Vykdyti",
                days: ["Pirmadienis", "Antradienis", "Trečiadienis", "Ketvirtadienis", "Penktadienis", "Šeštadienis", "Sekmadienis"],
                hours: "Val."
            },
            en: {
                title: "Work Log Pro",
                subtitle: "Manage your working hours easily",
                pildytojasLabel: "Report filled by:",
                pildytojasPlaceholder: "Enter name / surname",
                totalHours: "TOTAL HOURS PER WEEK:",
                peopleSum: "people total",
                aiBtn: "Translate Notes (AI)",
                modalTitle: "AI Notes Translation",
                modalDesc: "Paste your raw notes and AI will organize them.",
                cancel: "Cancel",
                process: "Process",
                days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                hours: "hrs"
            },
            ru: {
                title: "Журнал Рабочего Времени",
                subtitle: "Управляйте своим рабочим временем легко",
                pildytojasLabel: "Отчет составил:",
                pildytojasPlaceholder: "Введите имя / фамилию",
                totalHours: "ВСЕГО ЧАСОВ В НЕДЕЛЮ:",
                peopleSum: "чел. всего",
                aiBtn: "Перевести заметки (ИИ)",
                modalTitle: "Перевод заметок ИИ",
                modalDesc: "Вставьте свои заметки, и ИИ их упорядочит.",
                cancel: "Отмена",
                process: "Обработать",
                days: ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"],
                hours: "ч."
            }
        };

        let currentLang = localStorage.getItem('worklog_lang') || 'lt';
        document.getElementById('langSelect').value = currentLang;

        const daysData = [
            { nameKey: 0, people: 1, start: '07:00', end: '15:00', hours: 8, notes: '' },
            { nameKey: 1, people: 1, start: '07:00', end: '15:00', hours: 8, notes: '' },
            { nameKey: 2, people: 1, start: '07:00', end: '15:00', hours: 8, notes: '' },
            { nameKey: 3, people: 1, start: '07:00', end: '15:00', hours: 8, notes: '' },
            { nameKey: 4, people: 1, start: '07:00', end: '15:00', hours: 8, notes: '' },
            { nameKey: 5, people: 1, start: '07:00', end: '15:00', hours: 8, notes: '' },
            { nameKey: 6, people: 1, start: '07:00', end: '15:00', hours: 8, notes: '' }
        ];

        const savedData = localStorage.getItem('worklog_data');
        if (savedData) {
            try { JSON.parse(savedData).forEach((d, i) => { if(daysData[i]) daysData[i] = {...daysData[i], ...d}; }); } catch(e){}
        }

        const savedPildytojas = localStorage.getItem('worklog_pildytojas') || '';
        document.getElementById('pildytojasInput').value = savedPildytojas;
        document.getElementById('pildytojasInput').addEventListener('input', (e) => {
            localStorage.setItem('worklog_pildytojas', e.target.value);
        });

        function saveData() {
            localStorage.setItem('worklog_data', JSON.stringify(daysData));
        }

        function renderUI() {
            const t = translations[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-subtitle').innerText = t.subtitle;
            document.getElementById('ui-pildytojas-label').innerText = t.pildytojasLabel;
            document.getElementById('pildytojasInput').placeholder = t.pildytojasPlaceholder;
            document.getElementById('ui-total-hours-label').innerText = t.totalHours;
            document.getElementById('ui-ai-btn').innerText = t.aiBtn;
            document.getElementById('ui-modal-title').innerText = t.modalTitle;
            document.getElementById('ui-modal-desc').innerText = t.modalDesc;
            document.getElementById('aiCloseModal').innerText = t.cancel;
            document.getElementById('aiProcessBtn').innerText = t.process;

            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            let totalH = 0;
            let totalP = 0;

            daysData.forEach((day, index) => {
                totalH += parseFloat(day.hours) || 0;
                totalP += parseInt(day.people) || 0;

                const dayCard = document.createElement('div');
                dayCard.className = 'bg-white rounded-2xl shadow-sm p-3.5 border border-gray-100';
                dayCard.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-gray-800 text-sm">${t.days[day.nameKey]}</span>
                        <div class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-lg border border-gray-200">
                            <input type="number" min="1" value="${day.people}" data-index="${index}" class="people-input w-8 text-center text-xs font-semibold bg-transparent focus:outline-none">
                            <span class="text-xs text-gray-400">žm.</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div>
                            <span class="text-[10px] text-gray-400 block mb-0.5">Nuo - Iki</span>
                            <div class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-lg border border-gray-200">
                                <input type="text" value="${day.start}" data-index="${index}" data-field="start" class="time-input w-14 text-center text-xs bg-transparent focus:outline-none">
                                <span class="text-gray-300">-</span>
                                <input type="text" value="${day.end}" data-index="${index}" data-field="end" class="time-input w-14 text-center text-xs bg-transparent focus:outline-none">
                            </div>
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-400 block mb-0.5">Valandos</span>
                            <div class="flex items-center gap-1 bg-blue-50/50 px-2 py-1 rounded-lg border border-blue-100">
                                <input type="number" step="0.5" value="${day.hours}" data-index="${index}" data-field="hours" class="hours-input w-full text-center text-xs font-bold text-blue-600 bg-transparent focus:outline-none">
                                <span class="text-xs text-blue-400">${t.hours}</span>
                            </div>
                        </div>
                    </div>
                    <input type="text" placeholder="Papildomi užrašai..." value="${day.notes}" data-index="${index}" data-field="notes" class="notes-input w-full text-xs bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1.5 text-gray-600 focus:outline-none focus:ring-1 focus:ring-blue-500">
                `;
                container.appendChild(dayCard);
            });

            document.getElementById('totalHours').innerText = totalH.toFixed(1) + ' val.';
            document.getElementById('totalPeopleSum').innerText = totalP + ' ' + t.peopleSum;

            attachListeners();
        }

        function attachListeners() {
            document.querySelectorAll('.people-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    daysData[e.target.dataset.index].people = e.target.value;
                    saveData();
                });
            });
            document.querySelectorAll('.time-input, .hours-input, .notes-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.index;
                    const field = e.target.dataset.field;
                    daysData[idx][field] = e.target.value;
                    saveData();
                });
            });
        }

        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('worklog_lang', currentLang);
            renderUI();
        });

        const modal = document.getElementById('aiModal');
        document.getElementById('aiBtn').addEventListener('click', () => modal.classList.remove('hidden', 'flex') || modal.classList.add('flex'));
        document.getElementById('aiCloseModal').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('aiProcessBtn').addEventListener('click', () => {
            const text = document.getElementById('aiInputText').value.toLowerCase();
            daysData.forEach(d => {
                if (text.includes('10') || text.includes('daug')) d.hours = 10;
            });
            saveData();
            renderUI();
            modal.classList.add('hidden');
            document.getElementById('aiInputText').value = '';
        });

        document.getElementById('exportExcel').addEventListener('click', () => {
            const pildytojas = document.getElementById('pildytojasInput').value;
            const ws_data = [
                ["Darbo Valandų Žurnalas"],
                ["Ataskaitą pildo:", pildytojas],
                [],
                ["Diena", "Žmonės", "Nuo", "Iki", "Valandos", "Užrašai"]
            ];
            daysData.forEach((d, i) => {
                ws_data.push([translations[currentLang].days[d.nameKey], d.people, d.start, d.end, d.hours, d.notes]);
            });
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            XLSX.utils.book_append_sheet(wb, ws, "Ataskaita");
            XLSX.writeFile(wb, "WorkLogPro_Ataskaita.xlsx");
        });

        document.getElementById('exportWord').addEventListener('click', async () => {
            const pildytojas = document.getElementById('pildytojasInput').value;
            const t = translations[currentLang];
            const doc = new docx.Document({
                sections: [{
                    properties: {},
                    children: [
                        new docx.Paragraph({ text: "Darbo Valandų Žurnalas", heading: docx.HeadingLevel.TITLE }),
                        new docx.Paragraph({ text: `Ataskaitą pildo: ${pildytojas}` }),
                        new docx.Paragraph({ text: "" }),
                        new docx.Table({
                            rows: [
                                new docx.TableRow({
                                    children: [
                                        new docx.TableCell({ children: [new docx.Paragraph("Diena")] }),
                                        new docx.TableCell({ children: [new docx.Paragraph("Žm.")] }),
                                        new docx.TableCell({ children: [new docx.Paragraph("Laikas")] }),
                                        new docx.TableCell({ children: [new docx.Paragraph("Val.")] }),
                                        new docx.TableCell({ children: [new docx.Paragraph("Užrašai")] }),
                                    ]
                                }),
                                ...daysData.map(d => new docx.TableRow({
                                    children: [
                                        new docx.TableCell({ children: [new docx.Paragraph(t.days[d.nameKey])] }),
                                        new docx.TableCell({ children: [new docx.Paragraph(String(d.people))] }),
                                        new docx.TableCell({ children: [new docx.Paragraph(`${d.start}-${d.end}`)] }),
                                        new docx.TableCell({ children: [new docx.Paragraph(String(d.hours))] }),
                                        new docx.TableCell({ children: [new docx.Paragraph(d.notes || "")] }),
                                    ]
                                }))
                            ]
                        })
                    ]
                }]
            });
            const blob = await docx.Packer.toBlob(doc);
            saveAs(blob, "WorkLogPro_Ataskaita.docx");
        });

        renderUI();
    </script>
</body>
</html>
